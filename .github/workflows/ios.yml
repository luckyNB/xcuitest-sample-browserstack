name: XCUI Tests

on:
  pull_request:
    branches:
      - master
      - main

  push:
    branches:
      - master
      - main

  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcui-tests:

    name: XCUI Tests

    # XCUI tests require macOS and Xcode.
    runs-on: macos-15

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. Checkout source code
      # ==========================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Select Xcode
      # ==========================================================
      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -la /Applications | grep Xcode || true

          sudo xcode-select -s /Applications/Xcode.app

          echo "Selected Xcode:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

      # ==========================================================
      # 3. Show available iOS simulators
      # ==========================================================
      - name: List available iOS simulators
        run: |
          echo "Available simulators:"
          xcrun simctl list devices available

      # ==========================================================
      # 4. Clean previous test results
      # ==========================================================
      - name: Prepare test results directory
        run: |
          rm -rf test-results
          mkdir -p test-results

      # ==========================================================
      # 5. Build and execute XCUI tests
      #
      # IMPORTANT:
      # CHANGE THESE VALUES:
      #
      #   MyApp.xcworkspace -> your workspace
      #   MyApp             -> your scheme
      #   iPhone 16         -> your simulator
      #
      # If you have .xcodeproj instead of .xcworkspace,
      # replace -workspace with -project.
      # ==========================================================
      - name: Run XCUI tests
        id: xcui_tests
        continue-on-error: true
        run: |
          set -o pipefail

          echo "Starting XCUI test execution..."

          xcodebuild test \
            -workspace MyApp.xcworkspace \
            -scheme MyApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$PWD/test-results/XCUIResults.xcresult" \
            clean test \
            | tee "$PWD/test-results/xcodebuild.log"

      # ==========================================================
      # 6. Check whether XCUI test execution failed
      # ==========================================================
      - name: Check XCUI test result
        id: test_status
        if: always()
        run: |
          if [ "${{ steps.xcui_tests.outcome }}" = "success" ]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================================
      # 7. Extract test result information
      # ==========================================================
      - name: Generate XCUI test report
        if: always()
        run: |
          echo "Generating XCUI test report..."

          if [ -d "test-results/XCUIResults.xcresult" ]; then

            echo "XCResult bundle found."

            xcrun xcresulttool get test-results/XCUIResults.xcresult \
              --format json \
              > test-results/xcresult.json 2>/dev/null || true

            echo "XCResult report generated."

          else

            echo "WARNING: XCResult bundle was not generated."

            echo "{}" > test-results/xcresult.json

          fi

      # ==========================================================
      # 8. Create GitHub Actions Job Summary
      # ==========================================================
      - name: Publish XCUI Test Summary
        if: always()
        run: |

          echo "# 📱 XCUI Test Execution Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Test Status" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Information | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ steps.test_status.outputs.emoji }} ${{ steps.test_status.outputs.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | `${{ github.sha }}` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | ${{ runner.os }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Xcode | $(xcodebuild -version | head -1) |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📊 Test Result" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.xcui_tests.outcome }}" = "success" ]; then

            echo "### ✅ XCUI Tests Passed" >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "The XCUI test execution completed successfully." >> "$GITHUB_STEP_SUMMARY"

          else

            echo "### ❌ XCUI Tests Failed" >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "One or more XCUI tests failed. Download the **xcui-test-results** artifact for detailed debugging information." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📦 Available Artifacts" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- **xcui-test-results** - Complete XCResult bundle, logs and JSON report" >> "$GITHUB_STEP_SUMMARY"
          echo "- **xcui-test-artifacts** - Screenshots and test attachments" >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # 9. Upload XCUI result bundle
      #
      # ALWAYS upload, even if tests fail.
      # ==========================================================
      - name: Upload XCUI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcui-test-results
          path: |
            test-results/XCUIResults.xcresult
            test-results/xcresult.json
            test-results/xcodebuild.log
          retention-days: 14
          if-no-files-found: warn

      # ==========================================================
      # 10. Upload screenshots and attachments
      # ==========================================================
      - name: Upload screenshots and attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcui-test-artifacts
          path: |
            **/Screenshots/**
            **/Attachments/**
            **/*.png
            **/*.jpg
            **/*.jpeg
          retention-days: 14
          if-no-files-found: ignore

      # ==========================================================
      # 11. Fail the GitHub Actions job if XCUI tests failed
      #
      # This step is intentionally LAST so that all reports and
      # artifacts are uploaded before the job is marked failed.
      # ==========================================================
      - name: Fail workflow if XCUI tests failed
        if: always()
        run: |
          if [ "${{ steps.xcui_tests.outcome }}" != "success" ]; then
            echo "❌ XCUI tests failed."
            echo "Please download the xcui-test-results artifact for details."
            exit 1
          fi

          echo "✅ All XCUI tests passed successfully."
```
