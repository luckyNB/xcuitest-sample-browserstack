name: XCUI Tests

on:
  pull_request:
    branches:
      - master
      - main

  push:
    branches:
      - master
      - main

  schedule:
    - cron: "0 6 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcui-tests:

    name: XCUI Tests

    # XCUI tests require macOS + Xcode
    runs-on: macos-15

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. Checkout source code
      # ==========================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Select Xcode
      # ==========================================================
      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -la /Applications | grep Xcode || true

          sudo xcode-select -s /Applications/Xcode.app

          echo "Selected Xcode:"
          xcode-select -p

          echo "Xcode version:"
          xcodebuild -version

      # ==========================================================
      # 3. List available simulators
      # ==========================================================
      - name: List available iOS simulators
        run: |
          echo "Available iOS simulators:"
          xcrun simctl list devices available

      # ==========================================================
      # 4. Prepare test results directory
      # ==========================================================
      - name: Prepare test results directory
        run: |
          rm -rf test-results
          mkdir -p test-results

      # ==========================================================
      # 5. Run XCUI tests
      #
      # IMPORTANT:
      # Change:
      #
      # MyApp.xcworkspace
      # MyApp
      # iPhone 16
      #
      # according to your project.
      # ==========================================================
      - name: Run XCUI tests
        id: xcui_tests
        continue-on-error: true
        run: |
          echo "Starting XCUI test execution..."

          set +e

          xcodebuild \
            -workspace MyApp.xcworkspace \
            -scheme MyApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$PWD/test-results/XCUIResults.xcresult" \
            clean test \
            2>&1 | tee "$PWD/test-results/xcodebuild.log"

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "XCUI_TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "XCUI Test Exit Code: $TEST_EXIT_CODE"
          echo "======================================"

          exit 0

      # ==========================================================
      # 6. Generate xcresult JSON report
      # ==========================================================
      - name: Generate XCUI result report
        if: always()
        run: |

          echo "Generating XCUI result report..."

          if [ -d "test-results/XCUIResults.xcresult" ]; then

            echo "XCResult bundle found."

            xcrun xcresulttool get \
              test-results/XCUIResults.xcresult \
              --format json \
              > test-results/xcresult.json 2>/dev/null || true

            echo "XCResult JSON generated."

          else

            echo "WARNING: XCResult bundle was not generated."

            echo "{}" > test-results/xcresult.json

          fi

      # ==========================================================
      # 7. Extract test summary
      # ==========================================================
      - name: Generate test execution summary
        if: always()
        run: |

          echo "# 📱 XCUI Test Execution Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Test Execution" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | ${{ runner.os }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Xcode | $(xcodebuild -version | head -1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Exit Code | ${XCUI_TEST_EXIT_CODE:-unknown} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${XCUI_TEST_EXIT_CODE:-1}" = "0" ]; then

            echo "## ✅ XCUI Tests Passed" >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "All XCUI tests completed successfully." >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ❌ XCUI Tests Failed" >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "One or more XCUI tests failed." >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "Download the **xcui-test-results** artifact to investigate the failure." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📦 Test Artifacts" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- XCResult bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "- Xcode build/test log" >> "$GITHUB_STEP_SUMMARY"
          echo "- XCResult JSON report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots and attachments, if generated" >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # 8. Upload XCUI test results
      #
      # IMPORTANT:
      # always() ensures artifacts are uploaded even if tests fail.
      # ==========================================================
      - name: Upload XCUI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcui-test-results
          path: |
            test-results/XCUIResults.xcresult
            test-results/xcresult.json
            test-results/xcodebuild.log
          retention-days: 14
          if-no-files-found: warn

      # ==========================================================
      # 9. Upload screenshots and attachments
      # ==========================================================
      - name: Upload screenshots and attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcui-test-artifacts
          path: |
            **/Screenshots/**
            **/Attachments/**
            **/*.png
            **/*.jpg
            **/*.jpeg
          retention-days: 14
          if-no-files-found: ignore

      # ==========================================================
      # 10. Final workflow status
      #
      # This is the ONLY step that fails the workflow.
      # It runs AFTER reports and artifacts are uploaded.
      # ==========================================================
      - name: Set final XCUI test status
        if: always()
        run: |

          echo "======================================"
          echo "Final XCUI Test Status"
          echo "======================================"

          echo "XCUI_TEST_EXIT_CODE=${XCUI_TEST_EXIT_CODE:-unknown}"

          if [ "${XCUI_TEST_EXIT_CODE:-1}" != "0" ]; then

            echo ""
            echo "❌ XCUI tests failed."
            echo "Test reports and artifacts have already been uploaded."
            echo ""

            exit 1

          else

            echo ""
            echo "✅ All XCUI tests passed successfully."
            echo ""

          fi
